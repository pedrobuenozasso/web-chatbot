services:
  n8n:
    environment:
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_MAX_CONCURRENCY=2
      - N8N_RUNNERS_TASK_REQUEST_TIMEOUT=120
      # Evita que uma execução grande atinja o limite padrão do heap do Node e
      # derrube o orquestrador. Não altera nem apaga históricos de execução.
      - NODE_OPTIONS=--max-old-space-size=5120

  task-runners:
    image: n8nio/runners:2.18.7
    restart: unless-stopped
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=0
    depends_on:
      - n8n
